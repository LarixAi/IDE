name: Migrate CodeMe IDE snapshot

on:
  push:
    paths:
      - ".github/workflows/migrate-codeme-ide.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy CodeMe IDE snapshot
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REPO="https://github.com/LarixAi/coding-IDE-.git"
          SOURCE_BRANCH="codeme/reference-pipeline-port"
          EXPECTED_SHA="31eba4ccc821043fdac9dee64d2cca5cbec53081"
          MIGRATION_WORKFLOW=".github/workflows/migrate-codeme-ide.yml"

          cp "$MIGRATION_WORKFLOW" /tmp/migrate-codeme-ide.yml

          git remote add codeme-source "$SOURCE_REPO"
          git fetch --no-tags --depth=1 codeme-source "$SOURCE_BRANCH"
          SOURCE_SHA="$(git rev-parse FETCH_HEAD)"

          if [ "$SOURCE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Source branch moved: expected $EXPECTED_SHA, got $SOURCE_SHA" >&2
            exit 1
          fi

          # Replace the target tree with the pinned IDE snapshot.
          git rm -r -f .
          git checkout "$SOURCE_SHA" -- .

          # The Actions token cannot create/update workflow files. Keep this
          # migration workflow unchanged and copy the rest of the IDE now.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/migrate-codeme-ide.yml "$MIGRATION_WORKFLOW"
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: copy CodeMe IDE snapshot"
          git push origin HEAD:main
