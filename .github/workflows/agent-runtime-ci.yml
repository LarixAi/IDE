name: Agent Runtime CI

on:
  push:
    branches:
      - main
      - codeme/openhands-step-loop-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Run CodeMe scripted CI
        run: sh scripts/test-ci.sh
